<script>

function searchPage(){

    let text = document.getElementById("search").value.toLowerCase().trim();

    if(text === ""){

        alert("Vui lòng nhập từ khóa.");
        return;

    }

    const pages = {

        // Game
        "stw": "stw.html",
        "eurofly": "eurofly.html",
        "entombed": "entombed.html",
        "q9": "q9actiongame.html",
        "q9 action game": "q9actiongame.html",
        "blastbay": "blastbay.html",
        "top speed": "topspeed.html",
        "topspeed": "topspeed.html",

        // Phần mềm
        "nvda": "nvda.html",
        "obs": "obs studio.html",
        "obs studio": "obs studio.html",
        "reaper": "reaper.html",

        // Trang
        "trò chơi": "games.html",
        "game": "games.html",
        "phần mềm": "software.html",
        "tin tức": "news.html",
        "thông tin": "about.html",
        "liên hệ": "contact.html"

    };

    if(pages[text]){

        window.location.href = pages[text];
        return;

    }

    alert("Không có kết quả.");

}

document.getElementById("search").addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        searchPage();

    }

});

</script>

<script>

// Thời gian còn lại trước khi cập nhật (phút)
let minutes = ;

// Phiên bản mới
let version = "";

let seconds = minutes * 60;

const notice = document.getElementById("notice");

function updateNotice(){

    let m = Math.floor(seconds / 60);
    let s = seconds % 60;

    notice.textContent =
    "Thông báo: Trang web sẽ cập nhật sau " +
    m +
    " phút " +
    s +
    " giây.";

}

updateNotice();

let updateTimer = setInterval(function(){

    seconds--;

    if(seconds <= 0){

        clearInterval(updateTimer);

        notice.textContent =
        "Trang web đang cập nhật. Vui lòng quay lại sau.";

        return;

    }

    updateNotice();

},1000);

</script>
