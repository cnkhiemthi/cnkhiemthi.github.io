<script>

let minutes = ;
let version = "";

let seconds = minutes * 60;

function updateNotice() {

    let m = Math.floor(seconds / 60);
    let s = seconds % 60;

    document.getElementById("notice").textContent =
        "Trang web sẽ cập nhật sau " + m + " phút " + s + " giây.";

}

updateNotice();

let timer = setInterval(function () {

    seconds--;

    if (seconds <= 0) {

        clearInterval(timer);

        document.getElementById("notice").textContent =
            "Website đã được cập nhật thành phiên bản " + version + ".";

        return;

    }

    updateNotice();

}, 1000);

</script>
