<script>

function searchPage(){

    let text = document.getElementById("search").value.toLowerCase().trim();


    if(text.includes("stw")){

        window.location.href = "games.html";
        return;

    }


    if(text.includes("game") || text.includes("trò chơi")){

        window.location.href = "games.html";
        return;

    }


    if(text.includes("nvda") ||
       text.includes("reaper") ||
       text.includes("obs") ||
       text.includes("phần mềm")){

        window.location.href = "software.html";
        return;

    }


    if(text.includes("tin tức")){

        window.location.href = "news.html";
        return;

    }


    if(text.includes("thông tin")){

        window.location.href = "about.html";
        return;

    }


    if(text.includes("liên hệ")){

        window.location.href = "contact.html";
        return;

    }


    alert("Không tìm thấy kết quả.");

}


document.getElementById("search").addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        searchPage();

    }

});


</script>

<script>

let minutes = ;
let version = "";

let seconds = minutes * 60;


function updateNotice(){

    let m = Math.floor(seconds / 60);
    let s = seconds % 60;


    document.getElementById("notice").textContent =
    "Trang web sẽ cập nhật sau " + m + " phút " + s + " giây.";

}


updateNotice();


let updateTimer = setInterval(function(){

    seconds--;


    if(seconds <= 0){

        clearInterval(updateTimer);


        document.getElementById("notice").textContent =
        "Website đã được cập nhật thành phiên bản " + version + ".";


        return;

    }


    updateNotice();


},1000);


</script>
