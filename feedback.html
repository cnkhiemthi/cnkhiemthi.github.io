<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Góp ý</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

.container{
    max-width:700px;
    margin:50px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

p{
    text-align:center;
}

textarea{
    width:100%;
    height:180px;
    padding:10px;
    font-size:16px;
    resize:vertical;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    font-size:18px;
    cursor:pointer;
    border:none;
    background:#0078d7;
    color:white;
    border-radius:6px;
}

button:hover{
    background:#005fa3;
}
</style>

</head>
<body>

<div class="container">
<h2>💬 Góp ý</h2>

<p>Nếu bạn có ý tưởng hoặc góp ý để website tốt hơn, hãy để lại bên dưới.</p>

<textarea
placeholder="Nhập góp ý của bạn tại đây..."
aria-label="Ô nhập góp ý">
</textarea>

<button>Gửi góp ý</button>

</div>

</body>
</html>
